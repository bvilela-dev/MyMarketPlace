kind: Service
metadata:
  name: catalog-api
  namespace: marketplace
spec:
  selector: {app: catalog-api}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: grpc, port: 8081, targetPort: grpc}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-api
  namespace: marketplace
