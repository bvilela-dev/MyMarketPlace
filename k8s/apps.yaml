# =============================================================================
# Cart — carrinho em Redis. Sem banco relacional, sem fila.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-api
  namespace: marketplace
  labels: {app: cart-api, tier: backend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: cart-api}
  template:
    metadata:
      labels: {app: cart-api, tier: backend}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1654}
      containers:
        - name: cart-api
          image: mymarketplace/cart-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: ASPNETCORE_URLS, valueFrom: {configMapKeyRef: {name: marketplace-config, key: ASPNETCORE_URLS}}}
            - {name: ASPNETCORE_ENVIRONMENT, valueFrom: {configMapKeyRef: {name: marketplace-config, key: ASPNETCORE_ENVIRONMENT}}}
            - {name: OpenTelemetry__OtlpEndpoint, valueFrom: {configMapKeyRef: {name: marketplace-config, key: OTLP_ENDPOINT}}}
            - {name: ConnectionStrings__Redis, valueFrom: {secretKeyRef: {name: marketplace-secrets, key: REDIS_CONNECTION}}}
            - {name: Jwt__Secret, valueFrom: {secretKeyRef: {name: marketplace-secrets, key: JWT_SECRET}}}
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
