# HPA por CPU num consumidor de fila e um proxy imperfeito: o sinal correto seria
# o tamanho da fila (via KEDA, por exemplo), que mede o trabalho ACUMULADO em vez
# do consumo instantaneo. Fica como CPU aqui por nao depender de operador extra.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-api
  namespace: marketplace
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: payment-api}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 80}}
---
