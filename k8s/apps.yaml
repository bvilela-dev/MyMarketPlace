# =============================================================================
# MyMarketPlace — workloads da aplicacao.
#
# Aplicar DEPOIS de k8s/platform.yaml (namespace, bancos, RabbitMQ, Redis,
# collector). Ver README para o passo a passo com k3s.
#
# Padrao repetido em todos os Deployments:
#   * probes de liveness e readiness separadas;
#   * requests e limits de CPU/memoria;
#   * configuracao por ConfigMap, segredos por Secret;
#   * securityContext sem privilegios.
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: marketplace-config
  namespace: marketplace
data:
  OTLP_ENDPOINT: http://otel-collector:4317
  ASPNETCORE_URLS: http://+:8080
  ASPNETCORE_ENVIRONMENT: Production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: marketplace
data:
  ReverseProxy__Clusters__identity-cluster__Destinations__d1__Address: http://identity-api:8080/
  ReverseProxy__Clusters__catalog-cluster__Destinations__d1__Address: http://catalog-api:8080/
  ReverseProxy__Clusters__cart-cluster__Destinations__d1__Address: http://cart-api:8080/
  ReverseProxy__Clusters__order-cluster__Destinations__d1__Address: http://order-api:8080/
---
# =============================================================================
# Identity — autenticacao, perfil, enderecos. Expoe REST (8080) e gRPC (8081).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: marketplace
  labels: {app: identity-api, tier: backend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: identity-api}
  template:
    metadata:
      labels: {app: identity-api, tier: backend}
    spec:
      securityContext:
        # Impede que o container rode como root mesmo que a imagem tente.
        runAsNonRoot: true
        runAsUser: 1654
      containers:
        - name: identity-api
          image: mymarketplace/identity-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
            - {name: grpc, containerPort: 8081}
          env:
            - {name: ASPNETCORE_ENVIRONMENT, valueFrom: {configMapKeyRef: {name: marketplace-config, key: ASPNETCORE_ENVIRONMENT}}}
            - {name: OpenTelemetry__OtlpEndpoint, valueFrom: {configMapKeyRef: {name: marketplace-config, key: OTLP_ENDPOINT}}}
            # Duas portas: HTTP/2 sem TLS nao negocia por ALPN, entao o gRPC precisa
            # de um endpoint proprio marcado explicitamente como Http2.
            - {name: Kestrel__Endpoints__Http__Url, value: "http://+:8080"}
            - {name: Kestrel__Endpoints__Http__Protocols, value: "Http1AndHttp2"}
            - {name: Kestrel__Endpoints__Grpc__Url, value: "http://+:8081"}
            - {name: Kestrel__Endpoints__Grpc__Protocols, value: "Http2"}
            - {name: ConnectionStrings__Postgres, value: "Host=postgres-identity;Port=5432;Database=identitydb;Username=postgres;Password=postgres"}
            - {name: ConnectionStrings__RabbitMq, valueFrom: {secretKeyRef: {name: marketplace-secrets, key: RABBITMQ_CONNECTION}}}
            - {name: Jwt__Secret, valueFrom: {secretKeyRef: {name: marketplace-secrets, key: JWT_SECRET}}}
          # ---------------------------------------------------------------
          # Liveness x readiness: a distincao mais importante das probes.
          #
          #  * liveness  = "o processo travou?"  -> falhou, o pod e REINICIADO.
          #    Nao consulta dependencia alguma. Se apontasse para o banco, uma
          #    queda momentanea do Postgres reiniciaria todos os pods em
          #    cascata — transformando indisponibilidade parcial em total.
          #
          #  * readiness = "posso receber trafego?" -> falhou, o pod so sai do
          #    balanceador. Verifica banco e cache; quando a dependencia volta,
          #    o pod volta a receber trafego sem reiniciar.
          # ---------------------------------------------------------------
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # startupProbe cobre a partida lenta (migracao do banco) sem precisar
          # afrouxar a liveness. Ate ela passar, as outras duas ficam suspensas:
          # 30 x 5s = ate 150s de tolerancia so na inicializacao.
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 30
          resources:
            # requests = o que o scheduler reserva; limits = o teto rigido.
            #
            # O request de CPU nao e opcional aqui: o HPA calcula a utilizacao
            # como uso/request. SEM request definido, nao existe base de calculo
            # e o autoscaler simplesmente nao funciona.
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: identity-api
  namespace: marketplace
spec:
  selector: {app: identity-api}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: grpc, port: 8081, targetPort: grpc}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: identity-api
  namespace: marketplace
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: identity-api}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 80}}
  behavior:
    scaleDown:
      # Janela longa na descida evita "flapping": subir e descer replicas a cada
      # pico curto custa mais (partida a frio) do que manter um pod a mais.
      stabilizationWindowSeconds: 300
---
# =============================================================================
# Catalog — vitrine. Expoe REST (8080) e gRPC (8081).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: marketplace
  labels: {app: catalog-api, tier: backend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: catalog-api}
  template:
    metadata:
      labels: {app: catalog-api, tier: backend}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1654}
      containers:
        - name: catalog-api
          image: mymarketplace/catalog-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
            - {name: grpc, containerPort: 8081}
          env:
            - {name: ASPNETCORE_ENVIRONMENT, valueFrom: {configMapKeyRef: {name: marketplace-config, key: ASPNETCORE_ENVIRONMENT}}}
            - {name: OpenTelemetry__OtlpEndpoint, valueFrom: {configMapKeyRef: {name: marketplace-config, key: OTLP_ENDPOINT}}}
            - {name: Kestrel__Endpoints__Http__Url, value: "http://+:8080"}
            - {name: Kestrel__Endpoints__Http__Protocols, value: "Http1AndHttp2"}
            - {name: Kestrel__Endpoints__Grpc__Url, value: "http://+:8081"}
            - {name: Kestrel__Endpoints__Grpc__Protocols, value: "Http2"}
            - {name: ConnectionStrings__Postgres, value: "Host=postgres-catalog;Port=5432;Database=catalogdb;Username=postgres;Password=postgres"}
            - {name: ConnectionStrings__Redis, valueFrom: {secretKeyRef: {name: marketplace-secrets, key: REDIS_CONNECTION}}}
            - {name: ConnectionStrings__RabbitMq, valueFrom: {secretKeyRef: {name: marketplace-secrets, key: RABBITMQ_CONNECTION}}}
            - {name: Jwt__Secret, valueFrom: {secretKeyRef: {name: marketplace-secrets, key: JWT_SECRET}}}
            # Popula o catalogo de demonstracao. Em producao ficaria "false".
            - {name: Seed__Enabled, value: "true"}
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
