# =============================================================================
# PodDisruptionBudget do gateway.
#
# Garante que uma manutencao planejada do cluster (drain de no, upgrade) nunca
# derrube a unica porta de entrada do sistema: pelo menos 1 pod fica de pe.
# Sem PDB, o Kubernetes pode evacuar os dois de uma vez.
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: marketplace
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: api-gateway}
