# =============================================================================
# MyMarketPlace — dependencias de plataforma.
#
# Aplicar ANTES de k8s/apps.yaml. Cria o namespace, os segredos, os quatro bancos
# Postgres, RabbitMQ, Redis e a stack de observabilidade.
#
# AVISO DE PRODUCAO: rodar banco de dados dentro do cluster e otimo para um
# ambiente de demonstracao e discutivel em producao. Backup, failover, upgrade de
# versao e tuning sao trabalho especializado — na vida real, esses quatro
# Postgres seriam servicos gerenciados (RDS, Cloud SQL, Azure Database), e este
# arquivo teria apenas os Secrets com as connection strings.
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: marketplace
  labels:
    name: marketplace
---
# =============================================================================
# Segredos.
#
# ATENCAO: um Secret do Kubernetes e apenas Base64 — NAO e criptografia. Qualquer
# pessoa com permissao de leitura no namespace ve o valor em texto puro.
#
# Em producao o caminho e um destes:
#   * criptografia em repouso no etcd (EncryptionConfiguration), ou
#   * External Secrets Operator + Vault / AWS Secrets Manager / Key Vault, ou
#   * Sealed Secrets, se a exigencia for versionar o segredo no Git.
#
# Os valores abaixo sao de demonstracao e devem ser trocados em qualquer uso real.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: marketplace-secrets
  namespace: marketplace
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres
  RABBITMQ_CONNECTION: rabbitmq://guest:guest@rabbitmq:5672
  REDIS_CONNECTION: redis:6379
  # Minimo de 32 bytes para HMAC-SHA256 — a aplicacao se recusa a subir com menos.
  JWT_SECRET: k8s-demo-secret-change-me-at-least-32-bytes-long
---
# =============================================================================
# Bancos de dados — um por microsservico.
#
# StatefulSet (e nao Deployment) porque banco tem estado:
#   * identidade de rede estavel (postgres-identity-0);
#   * volume proprio que sobrevive ao restart do pod, via volumeClaimTemplates.
#
# Com Deployment + volume efemero, um simples restart apagaria todos os dados —
# incluindo as migracoes ja aplicadas.
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-identity
  namespace: marketplace
spec:
  serviceName: postgres-identity
  replicas: 1
  selector:
    matchLabels: {app: postgres-identity}
  template:
    metadata:
      labels: {app: postgres-identity, tier: database}
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: identitydb}
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: marketplace-secrets, key: POSTGRES_PASSWORD}}}
            # A imagem do Postgres nao inicializa se o diretorio de dados nao
            # estiver vazio — e o volume montado traz um lost+found. O subdiretorio
            # resolve, e e a receita oficial da imagem.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres", "-d", "identitydb"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "postgres"]}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 1Gi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-identity
  namespace: marketplace
spec:
  selector: {app: postgres-identity}
  ports: [{port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-catalog
  namespace: marketplace
spec:
  serviceName: postgres-catalog
  replicas: 1
  selector:
    matchLabels: {app: postgres-catalog}
  template:
    metadata:
      labels: {app: postgres-catalog, tier: database}
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: catalogdb}
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: marketplace-secrets, key: POSTGRES_PASSWORD}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres", "-d", "catalogdb"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 1Gi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-catalog
  namespace: marketplace
spec:
  selector: {app: postgres-catalog}
  ports: [{port: 5432, targetPort: postgres}]
---
