  ports: [{port: 5432, targetPort: postgres}]
---
# =============================================================================
# RabbitMQ — barramento de eventos.
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: marketplace
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq, tier: messaging}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
          readinessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "check_running"]}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: 1000m, memory: 1Gi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: marketplace
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
    - {name: management, port: 15672, targetPort: management}
---
# =============================================================================
# Redis — cache do catalogo, carrinho e chaves de idempotencia.
#
# Deployment (nao StatefulSet) de proposito: tudo que guardamos no Redis e
# reconstrutivel — cache repovoa sozinho, carrinho tem TTL de 7 dias, marca de
# idempotencia so importa numa janela curta. Perder esses dados num restart e
# aceitavel; e exatamente essa a diferenca entre cache e banco de dados.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: marketplace
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis, tier: cache}
    spec:
      containers:
        - name: redis
          image: redis:7.4
          args:
            - redis-server
            - --maxmemory
            - 256mb
            # Politica de despejo: quando a memoria enche, descarta as chaves com
            # TTL menos usadas recentemente. Sem isso, o Redis para de aceitar
            # escrita ao atingir o limite — e o carrinho para de funcionar.
            - --maxmemory-policy
            - allkeys-lru
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 320Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: marketplace
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: redis}]
---
# =============================================================================
# Observabilidade — OpenTelemetry Collector + Prometheus + Grafana.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: marketplace
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25

    exporters:
      debug:
        verbosity: normal
      prometheus:
        endpoint: "0.0.0.0:8889"

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: marketplace
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector, tier: observability}
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.123.0
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: prom, containerPort: 8889}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: otel-collector-config.yaml
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: config
          configMap: {name: otel-collector-config}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: marketplace
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: prom, port: 8889, targetPort: prom}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: marketplace
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector:8889"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: marketplace
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus, tier: observability}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.3.1
          ports: [{name: http, containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: marketplace
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: http}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: marketplace
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: marketplace
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana, tier: observability}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.6.1
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: admin}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: datasources
          configMap: {name: grafana-datasources}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: marketplace
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: http}]
