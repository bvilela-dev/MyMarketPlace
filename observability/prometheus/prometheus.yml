# Configuracao do Prometheus.
#
# Repare que ele NAO raspa os microsservicos diretamente: raspa apenas o
# OpenTelemetry Collector, que ja recebeu as metricas de todos eles via OTLP.
#
# Vantagem pratica: adicionar um servico novo nao exige mexer neste arquivo nem
# manter uma lista de alvos sincronizada com o deploy.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          origem: microsservicos

  # O proprio Prometheus, para monitorar quem monitora.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
